    html, body { height: 100%; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--fg); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; max-width: 1200px; margin: 0 auto; padding: 28px; }
    .sidebar { position: sticky; top: 20px; align-self: start; border: 1px solid var(--border); background: var(--card); border-radius: 16px; padding: 22px; }
    .main { display: grid; gap: 24px; }
    .name { font-size: 28px; font-weight: 800; letter-spacing: .2px; }
    .tag { color: var(--muted); margin-top: 6px; }
    .section { border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 22px; }
    .section h2 { margin: 0 0 12px; font-size: 18px; text-transform: uppercase; letter-spacing: 1.2px; opacity: .9; }
    .list { display: grid; gap: 14px; }
    .item h3 { margin: 0; font-size: 17px; }
    .sub { color: var(--muted); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { background: var(--chip); border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
    .meta { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
    .contacts a { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius: 8px; border:1px solid var(--border); background: var(--bg); }
    .contacts { display: grid; gap: 8px; margin-top: 12px; }
    .lang { display:flex; gap:8px; flex-wrap: wrap; }
    .footer { color: var(--muted); font-size: 12px; text-align:center; padding: 18px 0 24px; }
    .ribbon { position: fixed; right: -42px; top: 18px; transform: rotate(45deg); background: var(--accent); color: #0b1021; padding: 8px 52px; font-weight: 700; border: 0; text-decoration: none; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
    .toolbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px; }
    .toggle { border:1px solid var(--border); background: var(--bg); color: var(--fg); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } .sidebar { position: static; } }
  </style>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const mode = saved || (prefers ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
    })();
    function toggleTheme(){
      const el = document.documentElement;
      const next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      el.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
